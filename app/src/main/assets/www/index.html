<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F141B">
<title>Hunterline</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: phone-first app shell. Sticky top bar, one scrolling column, fixed bottom bar that is either the tab nav or a composer. The Me tab is a resident ID card with stats and an honor meter, followed by a log of consequences. */
:root{
  --bg:#E7EAEE; --surface:#F6F7F9; --raised:#FFFFFF; --ink:#141A22; --muted:#5A6674; --line:#CDD3DB;
  --accent:#D13A1F; --accent-ink:#FFFFFF; --accent-text:#B42C13; --accent-soft:#F4D9D2;
  --good:#1E7A4C; --good-soft:#D6EBDD; --bad:#B3261E; --bad-soft:#F6D8D5; --warn:#8F5B00; --warn-soft:#F3E4C0;
  --font-display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#161C25; --raised:#1C2430; --ink:#E8ECF1; --muted:#98A4B3; --line:#2A3441;
    --accent:#E8553A; --accent-ink:#0F141B; --accent-text:#FF7A60; --accent-soft:#3A2420;
    --good:#4CC28A; --good-soft:#17332A; --bad:#FF8A80; --bad-soft:#3A2020; --warn:#E8B04A; --warn-soft:#38301A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#161C25; --raised:#1C2430; --ink:#E8ECF1; --muted:#98A4B3; --line:#2A3441;
  --accent:#E8553A; --accent-ink:#0F141B; --accent-text:#FF7A60; --accent-soft:#3A2420;
  --good:#4CC28A; --good-soft:#17332A; --bad:#FF8A80; --bad-soft:#3A2020; --warn:#E8B04A; --warn-soft:#38301A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}

.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block-end:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;margin-inline:-16px;padding:10px 16px;min-height:56px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:19px;letter-spacing:.04em}
.strap{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;margin-left:-8px;border-radius:50%}
.iconbtn:hover{background:var(--raised)}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.ttl .t1{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl .t2{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:6;width:100%;max-width:560px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.bar:empty{display:none}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500}
.nav button[aria-current="page"]{color:var(--accent-text);font-weight:700}
.nav .pip{position:absolute;top:4px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;max-height:120px;resize:none;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.45}
.link{color:var(--accent-text);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.h1{font-family:var(--font-display);font-size:26px;line-height:1.15;text-wrap:balance}
.sec{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-block:24px 4px;font-weight:500}
.lede{color:var(--muted);margin-top:8px;max-width:46ch}
.fine{font-size:13px;color:var(--muted);max-width:52ch}
.empty{padding:20px 0;color:var(--muted)}
.err{color:var(--accent-text);font-size:13px;min-height:1.2em}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-block:12px}
.mention{color:var(--accent-text);font-weight:600}
.hd{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* Avatars: gradient plus one of six patterns, or an uploaded picture */
.av{--h:215;--base:linear-gradient(145deg,hsl(var(--h) 55% 44%),hsl(calc(var(--h) + 28) 58% 26%));flex:none;position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--base);color:#fff;font-family:var(--font-display);font-size:15px;letter-spacing:.02em;text-shadow:0 1px 2px rgb(0 0 0 / .4)}
.av.lg{width:72px;height:72px;font-size:24px}
.av.sm{width:32px;height:32px;font-size:12px}
.av.p0{background:repeating-radial-gradient(circle at 78% 22%,rgb(255 255 255 / .2) 0 2px,transparent 2px 8px),var(--base)}
.av.p1{background:repeating-linear-gradient(135deg,rgb(255 255 255 / .17) 0 4px,transparent 4px 11px),var(--base)}
.av.p2{background:radial-gradient(rgb(255 255 255 / .24) 1.6px,transparent 2.2px) 0 0/9px 9px,var(--base)}
.av.p3{background:repeating-conic-gradient(from 0deg at 50% 50%,rgb(255 255 255 / .17) 0 9deg,transparent 9deg 18deg),var(--base)}
.av.p4{background:linear-gradient(rgb(255 255 255 / .14) 1px,transparent 1px) 0 0/9px 9px,linear-gradient(90deg,rgb(255 255 255 / .14) 1px,transparent 1px) 0 0/9px 9px,var(--base)}
.av.p5{background:repeating-linear-gradient(45deg,rgb(0 0 0 / .14) 0 5px,transparent 5px 12px),radial-gradient(circle at 30% 25%,rgb(255 255 255 / .22),transparent 55%),var(--base)}
.av.has-img{background:var(--raised)}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.avbtn{display:block;align-self:start;border-radius:50%}

.seg{display:grid;grid-template-columns:1fr 1fr;margin-inline:-16px;border-bottom:1px solid var(--line)}
.seg button{padding:12px 0;text-align:center;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.compose{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.compose textarea{width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 0}
.crow{display:flex;justify-content:space-between;align-items:center}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.refresh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.refresh .status{color:var(--muted);font-size:13px}
.status b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.autorow{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.switch{position:relative;flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
@media (prefers-reduced-motion: reduce){.switch,.switch::after{transition:none}}

.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.post[data-open]{cursor:pointer}
.post.reply{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:12px 0}
.pb{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.nm{font-weight:700}
.dt{color:var(--muted)}
.kind{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.txt{margin-block:2px 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.post.detail .txt{font-size:18px;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin-left:-8px}
.acts button{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;color:var(--muted);font-family:var(--font-mono);font-size:12px}
.acts button:hover{background:var(--raised)}
.acts button.on{color:var(--accent-text)}
.acts button.like.on svg{fill:currentColor}

.typing{display:flex;align-items:center;gap:8px;padding:12px 0;color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.6}}

.list .rowitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.rowitem .who{min-width:0}
.rowitem .who b{display:block}
.rowitem .who span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .end{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--font-mono);font-size:12px}
.pip2{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.chipbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)}
.chipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.msgs{display:flex;flex-direction:column;gap:6px;padding-block:14px}
.bubble{max-width:82%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:var(--raised);border:1px solid var(--line);border-bottom-left-radius:6px}
.openers{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.choices{display:grid;gap:8px;margin:2px 0 6px;max-width:92%}
.choice{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;line-height:1.3}
.choice:hover{border-color:var(--accent)}
.choicehint{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Consequences */
.d{display:inline-flex;gap:4px;align-items:center;padding:1px 9px;border-radius:999px;border:1px solid currentColor;font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.d.up{color:var(--good)}
.d.down{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tone{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:1px 8px;font-weight:500}
.tone.good{background:var(--good-soft);color:var(--good)}
.tone.bad{background:var(--bad-soft);color:var(--bad)}
.tone.mixed{background:var(--warn-soft);color:var(--warn)}
.tone.neutral{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.outcome{align-self:stretch;display:grid;gap:6px;padding:12px 14px;margin-block:4px;border-radius:12px;background:var(--surface);border:1px dashed var(--line)}
.outcome .oh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.impact{display:grid;gap:6px;padding:12px 14px;margin-top:14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line)}
.logitem{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.logitem .oh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.logitem time{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.logitem p{color:var(--muted);font-size:14px}

.prof{padding-block:18px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.phead{display:flex;gap:16px;align-items:center}
.pname{font-family:var(--font-display);font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.idtxt{min-width:0}
.role{display:inline-block;margin-top:6px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.pbio{max-width:52ch}
.bond{font-size:13px;color:var(--muted)}
.bond b{color:var(--ink)}

.idcard{margin-top:18px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.idband{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.idbody{display:flex;gap:16px;align-items:center;padding:16px 14px 6px}
.idbio{padding:6px 14px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 14px 0;border:1px solid var(--line);border-radius:12px}
.stats div{display:grid;gap:2px;padding:10px 4px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--font-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:400}
.stats span{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.honor{display:grid;gap:6px;margin:16px 14px 0}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hv{font-weight:700;font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good))}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bg);opacity:.9}
.track .mark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);border:3px solid var(--raised);box-shadow:0 0 0 1px var(--line)}
.hends{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.idfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;margin-top:14px;border-top:1px dashed var(--line);font-family:var(--font-mono);font-size:12px;color:var(--muted)}

.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setting b{font-weight:600}
.setting .fine{grid-column:1}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.keyrow input{flex:1;min-width:160px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit}

.setup{display:grid;gap:16px;padding-block:22px}
.idpreview{display:flex;gap:14px;align-items:center}
.field{display:grid;gap:6px}
.field label,.field .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;resize:vertical}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{--h:215;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 52% 38%);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:14px;align-items:center;max-width:min(520px,calc(100% - 32px));padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px}
.toast button{font-weight:700;color:inherit;text-decoration:underline;flex:none}
.toast .tc{display:inline-block;margin:2px 6px 0 0;font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.toast[hidden]{display:none!important}
</style>
<style>:root{--font-display:'Dela Gothic One',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}.brand,.h1,.pname,.stats b,.av{font-weight:800;font-synthesis:none}</style>

<div class="shell" id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div class="bar" id="bar"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-in" accept="image/*" hidden>

<script>
(function(){
'use strict';

/* In the claude.ai viewer, window.claude exists. In the installed app it does not. */
const STANDALONE=!(window.claude&&window.claude.use);
const AUTO_MS=300000;
const KINDS=['fan','troll','rival','reporter','recruiter','cultist','shopkeeper','kid','conspiracy','scammer','neighbor','stranger'];

/* ---------- Cast: original descriptions of each character's manner, no quoted dialogue ---------- */
const CAST=[
 {id:'makima',name:'Makima',handle:'makima_div4',ini:'MK',hue:6,role:'Public Safety · Division 4',
  bio:'Division 4. Please send your reports before the end of the day.',
  persona:'Calm, courteous head of Division 4. Soft-spoken and always faintly smiling. She never raises her voice and never quite answers the question you asked, yet seems to know more than she says. She treats people like valued pets or promising projects. Speaks in tidy, polite, complete sentences with a quiet, unsettling warmth.'},
 {id:'denji',name:'Denji',handle:'denji_dev',ini:'DJ',hue:28,role:'Devil hunter · Division 4',
  bio:'Hungry. Broke. Cheerful about it.',
  persona:'Broke, hungry, impulsive teenage devil hunter who shares his body with a chainsaw devil. Wants a normal life: hot meals, a real bed, friends. Loud and goofy with crude-ish humor kept clean enough for PG-13, and a big heart. Types in casual lowercase with exaggerated excitement.'},
 {id:'power',name:'Power',handle:'the_great_power',ini:'PW',hue:330,role:'Blood Fiend · Division 4',
  bio:'The greatest hunter in Tokyo. This is a fact.',
  persona:'A Blood Fiend who is certain she is the greatest hunter alive. Boastful, dramatic, a habitual liar, hates baths, adores cats. Talks about herself in grand terms and often in capital letters. Selfish on the surface, fiercely loyal to the few people she likes.'},
 {id:'aki',name:'Aki Hayakawa',handle:'aki_hayakawa',ini:'AH',hue:215,role:'Devil hunter · Division 4',
  bio:'Rules exist for a reason. Please read them.',
  persona:'Disciplined, serious Public Safety hunter. Strict about rules and paperwork, permanently tired of Denji and Power, but looks after them like a stern older brother. Short, dry, to-the-point sentences. Cares more than he admits.'},

const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};

function trim(){
  S.posts=S.posts.slice(0,30);
  S.posts.forEach(p=>{p.replies=p.replies.slice(-10);if(p.impacts)p.impacts=p.impacts.slice(-4);});
  Object.keys(S.dms).forEach(k=>{S.dms[k]=S.dms[k].slice(-24);});
  Object.keys(S.dms).filter(k=>!byId[k]).sort((a,b)=>lastT(S.dms[b])-lastT(S.dms[a])).slice(10).forEach(k=>{delete S.dms[k];delete S.unread[k];});
  S.log=S.log.slice(0,40);
  const live=new Set();Object.values(S.dms).forEach(th=>th.forEach(m=>{if(m.req)live.add(m.req);}));
  Object.keys(S.requests).forEach(r=>{if(!live.has(r))delete S.requests[r];});
  const used=new Set();S.posts.forEach(p=>{used.add(p.by);p.replies.forEach(r=>used.add(r.by));});
  Object.keys(S.dms).forEach(k=>used.add(k));S.pending.forEach(p=>used.add(p.npc));
  Object.keys(S.npcs).forEach(k=>{if(!used.has(k))delete S.npcs[k];});
  S.used=S.used.slice(-120);
}
function persist(){
  if(!S)return;
  trim();S.savedAt=Date.now();lsSet(LS_KEY,JSON.stringify(S));
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);
}
function persistAv(){lsSet(LS_AV,JSON.stringify(AVS));clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);}
function gameState(){const g=Object.assign({},S);delete g.dms;return g;}
async function flush(){
  if(!dbGame||dbReadOnly)return;
  if(saving){saveTimer=setTimeout(flush,800);return;}
  saving=true;
  try{
    if(S){
      const g=JSON.stringify(gameState());if(g!==lastW.game){await dbGame.set({state:JSON.parse(g)});lastW.game=g;}
      const d=JSON.stringify(S.dms);if(d!==lastW.dms){await dbDms.set({dms:S.dms});lastW.dms=d;}
    }
    const a=JSON.stringify(AVS);if(a!==lastW.av){await dbAv.set({avatars:AVS});lastW.av=a;}
  }catch(e){if(e&&e.code==='invalid_argument'&&/write|permission|exist/i.test(e.message||''))dbReadOnly=true;}
  finally{saving=false;}
}
async function initDb(){

/* ---------- AI layer: Claude on claude.ai, your own API key in the installed app, built-in lines otherwise ---------- */
const samplePromise=STANDALONE?Promise.resolve(null):window.claude.use('sample');
samplePromise.then(s=>{sampleObj=s;ui.sampleResolved=true;if(S)render();}).catch(()=>{ui.sampleResolved=true;});
const apiKey=()=>lsGet(LS_KEYAPI)||'';
function mode(){
  if(STANDALONE)return apiKey()?'key':'offline';
  if(sampleObj)return 'claude';
  return ui.sampleResolved?'offline':'claude';
}
const MODE_LABEL={claude:'Claude (through claude.ai)',key:'Your API key',offline:'Built-in stories (offline)'};
function errCopy(code){
  switch(code){
    case 'not_granted':return 'Claude access was declined for this page, so characters cannot reply right now.';
    case 'sampling_disabled':return "Claude isn't available on this account, so characters cannot reply.";
    case 'unavailable':case 'capability_disabled':case 'capability_removed':case 'not_declared':return "Character replies aren't available in this view.";
    case 'rate_limited':return 'Too many replies at once. Wait a moment, then try again.';
    case 'session_expired':return 'Sign in to Claude again, then try again.';
    case 'refused':return "That one didn't go through. Try different wording.";
    case 'invalid_json':case 'empty_completion':return 'The reply came back unreadable. Try again.';
    case 'bad_key':return 'That API key was rejected. Check it on the Me tab under Settings.';
    default:return "The reply didn't come through. Try again.";
  }
}
function parseJsonLoose(t){
  t=String(t||'').trim();
  try{return JSON.parse(t);}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json'};
}
function normTurns(turns){
  const out=[];
  turns.forEach(t=>{if(!t||!t.content)return;if(out.length&&out[out.length-1].role===t.role)out[out.length-1].content+='\n\n'+t.content;else out.push({role:t.role,content:t.content});});
  while(out.length&&out[0].role!=='user')out.shift();
  return out;
}
async function apiCall({system,turns,tier,signal,max}){
  if(!navigator.onLine)throw {code:'offline'};
  const key=apiKey();if(!key)throw {code:'offline'};
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:tier==='quick'?'claude-haiku-5-5':'claude-sonnet-5-5',max_tokens:max||1024,system:system||undefined,messages:normTurns(turns)})});
  }catch(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    throw {code:'offline'};
  }
  if(!res.ok){
    if(res.status===401||res.status===403)throw {code:'bad_key'};
    if(res.status===429)throw {code:'rate_limited'};
    throw {code:'upstream_error'};
  }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(!text.trim())throw {code:'empty_completion'};
  return text;
}
async function aiText({system,turns,tier,signal,onText}){
  const m=mode();
  if(m==='claude'){
    const s=await samplePromise;if(!s)throw {code:'unavailable'};
    const input=system?[{role:'user',content:system}].concat(turns):turns;
    const r=await s(input,{modelTier:tier||'quick',cache:false,signal:signal,onText:onText});
    ui.consented=true;return r.text;
  }
  if(m==='key'){const t=await apiCall({system,turns,tier,signal});if(onText)onText({text:t,delta:t});return t;}
  throw {code:'offline'};
}
async function aiJson(prompt,{tier,signal}){
  const m=mode();
  if(m==='claude'){
    const s=await samplePromise;if(!s)throw {code:'unavailable'};
    const v=await s.json(prompt,{modelTier:tier||'default',cache:false,signal:signal});
    ui.consented=true;return v;
  }
  if(m==='key'){
    const t=await apiCall({system:'You reply with only valid JSON, no prose and no code fences.',turns:[{role:'user',content:prompt}],tier,signal,max:2600});
    return parseJsonLoose(t);
  }
  throw {code:'offline'};
}

/* ---------- Prompts ---------- */
function worldBrief(){
  return "Hunterline is a fictional social network used by devil hunters in Tokyo, set in the world of Chainsaw Man early in the timeline: Division 4 of the Public Safety Devil Hunters is active, everyone is alive, and daily life mixes ordinary chores (rent, food, trains, paperwork) with devil sightings. Write new, original lines in each character's voice and never quote the manga or anime. Keep everything PG-13: no sexual or romantic content and no graphic gore.";
}
const STRANGER_RULES="Strangers are ordinary accounts in this world and can write whatever fits them: kind, rude, nosy, funny, strange, spammy, or menacing in the way a PG-13 show would allow. No slurs or hate toward real groups, no sexual content, no graphic gore, no real people. Strangers never ask for real-world personal information, passwords or payment details.";
const castBrief=()=>CAST.map(c=>'- '+c.id+' ('+c.name+', '+c.role+'): '+c.persona).join('\n');
const meBrief=()=>'The player is '+S.me.name+' (@'+S.me.handle+'), a '+S.me.role.toLowerCase()+' in this world.'+(S.me.bio?' Their bio: "'+S.me.bio+'".':'')+' Standing: '+standing()+'.';
const IMPACT_SPEC='"impact":{"honor":0,"aura":0,"followers":0,"title":"","why":""} judging only the player\'s latest message: honor -4 to 4 (kind, honest, brave goes up; cruel, deceitful, cowardly goes down), aura -12 to 12 (bold, funny, impressive goes up; embarrassing goes down), followers -40 to 40, title at most 40 characters, why one short sentence. Use 0 for neutral messages.';
const DM_SPEC='dms: exactly 1 item, a stranger (existing id or new) who messages the player with a request, offer, warning or favor that fits their kind. Format {"who":"stranger","id":"existing id or omit","name":"...","handle":"...","kind":"...","bio":"...","wants":"what they want, one short phrase","text":"opening message, at most 280 characters","options":[3 items]}. Each option is {"label":"the player\'s choice, at most 60 characters","reaction":"what the stranger texts back, at most 160 characters","title":"consequence headline, at most 40 characters","outcome":"the immediate consequence, at most 140 characters","honor":-4 to 4,"aura":-12 to 12,"followers":-40 to 40,"later":{"delayMin":2 to 15,"text":"a delayed consequence, at most 160 characters","post":"optional public post the stranger writes later, at most 200 characters, write @{me} where the player is mentioned","honor":0,"aura":0,"followers":0}}. The 3 options must be honest trade-offs: good deeds can cost something now, bad choices can pay off now and cost later. Never make the best option obvious.';

function normActor(x){
  if(!x||typeof x!=='object')return null;
  if(x.who==='cast'||(!x.who&&byId[x.id]))return byId[x.id]?x.id:null;
  if(byId[x.id])return x.id;
  if(x.id&&S.npcs[x.id])return x.id;
  if(!(x.name||x.handle))return null;
  return ensureNpc(x);
}
function ensureNpc(x){
  const name=clean(x.name,28)||'Anonymous';
  let handle=String(x.handle||name).toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,15)||('user'+rnd(100,999));
  const ex=Object.values(S.npcs).find(n=>n.handle===handle);
  if(ex)return ex.id;
  if(handle===S.me.handle||CAST.some(c=>c.handle===handle))handle=handle.slice(0,11)+rnd(100,999);
  const id='n_'+uid();
  S.npcs[id]={id:id,name:name,handle:handle,kind:KINDS.indexOf(x.kind)>=0?x.kind:'stranger',bio:clean(x.bio,90),wants:clean(x.wants,120),hue:rnd(0,359)};
  return id;
}
function pickItems(arr,max){
  if(!Array.isArray(arr))return [];
  const out=[];
  arr.slice(0,max).forEach(x=>{const by=normActor(x);const text=clean(x&&x.text,280);if(by&&text)out.push({by:by,text:text});});
  return out;
}
const openReqCount=()=>Object.values(S.requests).filter(r=>r.status==='open').length;

function addRequest(x){
  if(!x||typeof x!=='object')return null;
  const text=clean(x.text,300);
  const opts=(Array.isArray(x.options)?x.options:[]).slice(0,3).map((o,i)=>{
    const l=o&&o.later&&o.later.text?o.later:null;
    const b=o&&o.bond&&byId[o.bond.who]?{who:o.bond.who,delta:num(o.bond.delta,-2,2)}:null;
    return {id:'o'+i,label:clean(o&&o.label,70),reaction:clean(o&&o.reaction,180),title:clean(o&&o.title,44),outcome:clean(o&&o.outcome,160),
      honor:num(o&&o.honor,-4,4),aura:num(o&&o.aura,-15,15),followers:num(o&&o.followers,-60,60),bond:b,
      later:l?{delayMin:num(l.delayMin||5,1,30),text:clean(l.text,180),post:clean(l.post,220),by:byId[l.by]?l.by:'',honor:num(l.honor,-4,4),aura:num(l.aura,-15,15),followers:num(l.followers,-60,60)}:null};
  }).filter(o=>o.label);
  if(!text||opts.length<2)return null;
  const npcId=normActor(Object.assign({},x,{who:'stranger'}));
  if(!npcId||byId[npcId])return null;
  const rid='r_'+uid();
  S.requests[rid]={id:rid,npc:npcId,t:Date.now(),status:'open',options:opts};
  (S.dms[npcId]=S.dms[npcId]||[]).push({from:npcId,text:text,t:Date.now(),req:rid});
  S.unread[npcId]=true;S.lastRequest=Date.now();
  return npcId;
}

/* ---------- Built-in generators ---------- */
function unused(arr,keyFn){
  const left=arr.filter(x=>S.used.indexOf(keyFn(x))<0);
  if(!left.length){S.used=S.used.filter(u=>!arr.some(x=>keyFn(x)===u));return arr.slice();}
  return left;
}
function offlineFeed(){
  const posts=[];
  const castLines=[];
  Object.keys(OFF_CAST_POSTS).forEach(id=>OFF_CAST_POSTS[id].forEach(t=>castLines.push({id:id,text:t})));
  const cs=unused(castLines,x=>x.text).sort(()=>Math.random()-.5);
  const seen={};
  cs.forEach(x=>{if(posts.length<3&&!seen[x.id]){seen[x.id]=1;posts.push({who:'cast',id:x.id,text:x.text});S.used.push(x.text);}});
  const sp=OFF_STRANGERS.slice().sort(()=>Math.random()-.5);
  let n=0;
  sp.forEach(s=>{
    if(n>=2)return;
    const left=s.posts.filter(t=>S.used.indexOf(t)<0);
    if(!left.length)return;
    n++;S.used.push(left[0]);
    posts.push({who:'stranger',name:s.name,handle:s.handle,kind:s.kind,bio:s.bio,text:left[0]});
  });
  const dms=[];
  if(openReqCount()<2&&Date.now()-(S.lastRequest||0)>8*60000&&Math.random()<0.75){
    const sc=unused(OFF_SCEN,x=>x.text)[0];
    if(sc){
      const st=OFF_STRANGERS[sc.s];S.used.push(sc.text);
      dms.push({who:'stranger',name:st.name,handle:st.handle,kind:st.kind,bio:st.bio,text:sc.text,options:sc.options});
    }
  }
  return {posts:posts,dms:dms};
}
function lastMine(p){
  const r=p.replies.filter(x=>x.by==='me');
  return r.length?r[r.length-1].text:(p.by==='me'?p.text:'');
}
function localImpact(text){
  const t=String(text||'').toLowerCase();let h=0,a=0,f=0;
  if(/(thank|please|sorry|help|proud|congrat|appreciate|kind|friend|welcome)/.test(t)){h+=1;f+=3;}
  if(/(idiot|stupid|shut up|hate|loser|ugly|dumb|trash|pathetic|useless)/.test(t)){h-=2;a+=2;f-=4;}
  if(/(lie|steal|cheat|bribe|betray|snitch|rumou?r|gossip)/.test(t)){h-=1;a+=1;}
  if(t.length>140)a+=1;
  const tn=toneOf({honor:h,aura:a,followers:f},0);
  if(!h&&!a&&!f)return {honor:0,aura:0,followers:0};
  const title=tn==='good'?'Kind words travel':tn==='bad'?'That stung':'Mixed reaction';
  const why=tn==='good'?'People liked how you put that.':tn==='bad'?'Not everyone took that well.':'Some people cheered, others winced.';
  return {honor:h,aura:a,followers:f,title:title,why:why};
}
function offlineReplies(p){
  const items=[];
  const strangers=OFF_STRANGERS.slice().sort(()=>Math.random()-.5).slice(0,2);
  if(p.by==='me'){
    const casts=CAST.slice().sort(()=>Math.random()-.5).slice(0,2);
    casts.forEach(c=>items.push({who:'cast',id:c.id,text:pick(OFF_CAST_LINES[c.id])}));
  }else{
    items.push({who:'cast',id:p.by,text:pick(OFF_CAST_LINES[p.by]||["Noted."])});
  }
  strangers.forEach(s=>items.push({who:'stranger',name:s.name,handle:s.handle,kind:s.kind,bio:s.bio,text:pick(s.replies)}));
  return {replies:items,impact:localImpact(lastMine(p))};
}
function offlineDM(id,text){
  const a=actor(id);
  let line;
  if(a.cast)line=pick(OFF_CAST_LINES[id]);
  else{const st=OFF_STRANGERS.find(s=>s.kind===a.kind);line=pick(st?st.replies.concat(st.dms):["Okay. I'll think about it.","Fair enough.","Noted."]);}
  const imp=localImpact(text);
  imp.bond=imp.honor>0?1:imp.honor<0?-1:0;
  return {text:line,imp:imp};
}

/* ---------- Consequences ---------- */
function applyImpact(d,meta){
  meta=meta||{};
  d=clampD(d);
  const st=S.stats,b=Object.assign({},st);
  st.honor=clamp(st.honor+d.honor,-100,100);
  st.aura=Math.max(0,st.aura+d.aura);
  st.followers=Math.max(0,st.followers+d.followers);
  const act={honor:st.honor-b.honor,aura:st.aura-b.aura,followers:st.followers-b.followers};
  let bondNote=null;
  if(d.bond&&meta.bondWho&&byId[meta.bondWho]){
    const nb=clamp((S.bond[meta.bondWho]||0)+d.bond,-10,10);
    if(nb!==(S.bond[meta.bondWho]||0)){bondNote={who:meta.bondWho,delta:nb-(S.bond[meta.bondWho]||0)};S.bond[meta.bondWho]=nb;}
  }
  const tone=toneOf(act,bondNote?bondNote.delta:0);
  const notable=meta.force||Math.abs(act.honor)>=1||Math.abs(act.aura)>=3||Math.abs(act.followers)>=5||bondNote;
  const title=meta.title||(tone==='good'?'That went over well':tone==='bad'?"That didn't go over well":'Mixed reaction');
  if(notable){
    S.log.unshift({id:uid(),t:Date.now(),tone:tone,title:title,text:meta.text||'',d:act,bond:bondNote});
    S.log=S.log.slice(0,40);
    consequenceToast(title,act,bondNote);
  }
  return {act:act,bond:bondNote,tone:tone,title:title,notable:!!notable};
}
function consequenceToast(title,d,bondNote){
  let c='';
  const mk=(l,v)=>v?'<span class="tc">'+(v>0?'▲':'▼')+' '+l+' '+sign(v)+'</span>':'';
  c=mk('Honor',d.honor)+mk('Aura',d.aura)+mk('Followers',d.followers);
  if(bondNote)c+=mk('Bond · '+nameOf(bondNote.who),bondNote.delta);
  toastHTML('<span><b>'+esc(title)+'</b><br>'+c+'</span><button data-act="goto-me">View</button>');
}
function engage(){
  const now=Date.now();let add=0;
  S.posts.forEach(p=>{
    if(p.by!=='me'||now-p.t>86400000)return;
    const a=rnd(0,Math.max(1,Math.ceil(S.stats.followers/18)));
    if(a){p.likes+=a;add+=a;if(Math.random()<0.35)p.reposts+=1;}
  });
  S.carry=(S.carry||0)+add;
  const au=Math.floor(S.carry/5);S.carry-=au*5;S.stats.aura+=au;
  S.stats.followers+=Math.round(add/6)+(add>0&&Math.random()<0.4?1:0);
}
function processPending(){
  if(!S||!S.pending.length)return;
  const now=Date.now();
  const due=S.pending.filter(p=>p.due<=now);
  if(!due.length)return;
  S.pending=S.pending.filter(p=>p.due>now);
  due.forEach(p=>{
    const text=p.text.replace(/\{me\}/g,S.me.handle);
    if(p.post){
      S.posts.unshift({id:uid(),by:p.by||p.npc,text:clean(p.post.replace(/\{me\}/g,S.me.handle),280),t:now,likes:rnd(3,80),reposts:rnd(0,9),liked:false,reposted:false,replies:[]});
    }
    applyImpact(p.d,{title:p.title,text:text,force:true});
  });
  persist();render();
}
function choose(reqId,optId){
  const r=S.requests[reqId];if(!r||r.status!=='open')return;
  const o=r.options.find(x=>x.id===optId);if(!o)return;
  r.status='done';r.choice=optId;
  const th=S.dms[r.npc]||(S.dms[r.npc]=[]);
  const now=Date.now();
  th.push({from:'me',text:o.label,t:now});
  const d={honor:o.honor,aura:o.aura,followers:o.followers,bond:o.bond?o.bond.delta:0};
  const res=applyImpact(d,{title:o.title||'Your choice',text:o.outcome,force:true,bondWho:o.bond?o.bond.who:null});
  th.push({from:'sys',kind:'outcome',title:o.title||'Your choice',text:o.outcome,d:res.act,bond:res.bond,tone:res.tone,t:now+1});
  if(o.reaction)th.push({from:r.npc,text:o.reaction,t:now+2});
  if(o.later&&o.later.text){
    S.pending.push({id:uid(),due:now+clamp(o.later.delayMin||5,1,30)*60000,npc:r.npc,by:o.later.by||'',text:o.later.text,post:o.later.post||'',
      d:{honor:o.later.honor,aura:o.later.aura,followers:o.later.followers},title:'Later: '+(o.title||'your choice')});
  }
  persist();render();scrollEnd();
}

    'Known stranger accounts (reuse by "id" or introduce new ones):',known,'',
    'Return one JSON object {"posts":[...],"dms":[...]}.',
    'posts: 7 items, 4 or 5 from cast members and 2 or 3 from strangers. Cast item: {"who":"cast","id":"denji","text":"..."}. Stranger item: {"who":"stranger","id":"existing id or omit","name":"...","handle":"letters digits underscore","kind":"fan|troll|rival|reporter|recruiter|cultist|shopkeeper|kid|conspiracy|scammer|neighbor","bio":"at most 80 characters","text":"..."}. Each text is at most 240 characters. At most one post may mention the player by @handle.',
    wantDM?DM_SPEC:'dms: an empty array.'].join('\n');
  const v=await aiJson(prompt,{tier:'default',signal:signal});
  return Array.isArray(v)?{posts:v,dms:[]}:v;
}
function addFeed(res){
  const now=Date.now();
  const known=new Set(S.posts.map(p=>p.text));
  const fresh=[];
  (res.posts||[]).slice(0,8).forEach(x=>{
    const by=normActor(x);const text=clean(x&&x.text,280);
    if(!by||!text||known.has(text))return;
    const likes=rnd(4,320);
    fresh.push({id:uid(),by:by,text:text,t:now-rnd(0,25)*60000,likes:likes,reposts:Math.round(likes/9),liked:false,reposted:false,replies:[]});
  });
  S.posts=fresh.concat(S.posts).sort((a,b)=>b.t-a.t);
  (res.dms||[]).slice(0,1).forEach(x=>{
    if(openReqCount()>=3)return;
    const id=addRequest(x);
    if(id)toast(actor(id).name+' sent you a message','chat',id);
  });
}

/* ---------- Replies on posts ---------- */
async function aiReplies(p){
  const mine=p.by==='me';
  const lastR=p.replies[p.replies.length-1];
  const follow=!!(lastR&&lastR.by==='me');
  const thread=p.replies.slice(-8).map(r=>nameOf(r.by)+': '+r.text).join('\n');
  const known=Object.values(S.npcs).slice(0,10).map(n=>'- '+n.id+': '+n.name+' (@'+n.handle+', '+n.kind+')').join('\n')||'(none yet)';
  const L=[worldBrief(),STRANGER_RULES,'','Cast:',castBrief(),'',meBrief(),'','Known stranger accounts (reuse by "id" or introduce new ones):',known,''];
  L.push(mine?'The player posted publicly: "'+p.text+'"':nameOf(p.by)+' ('+p.by+') posted: "'+p.text+'"');
  if(thread)L.push('Replies so far:',thread);
  if(mine&&!follow)L.push('Write 3 or 4 public replies: 1 or 2 from cast members who would most naturally respond and at least 2 from strangers, who can say anything that fits them.');
  else if(mine)L.push("Write 2 or 3 replies to the player's latest reply, from people already in the thread or ones who would chime in, including at least one stranger.");
  else L.push("Write 3 replies: the first from "+nameOf(p.by)+" ("+p.by+") answering the player's latest reply directly, the others from a stranger and one more cast member who would chime in.");
  L.push('Each reply is at most 200 characters. Never write lines for the player.',
    'Return one JSON object {"replies":[...],'+IMPACT_SPEC,
    'Reply item for a cast member: {"who":"cast","id":"power","text":"..."}. Reply item for a stranger: {"who":"stranger","id":"existing id or omit","name":"...","handle":"...","kind":"fan|troll|rival|reporter|recruiter|cultist|shopkeeper|kid|conspiracy|scammer|neighbor","bio":"at most 80 characters","text":"..."}.');
  const v=await aiJson(L.join('\n'),{tier:'quick'});
  return Array.isArray(v)?{replies:v}:v;
}
function applyReplies(p,res){
  const now=Date.now();
  const items=pickItems(res.replies,4).map((x,i)=>({id:uid(),by:x.by,text:clean(x.text,220),t:now+i}));
  if(!items.length)throw {code:'empty_completion'};
  p.replies=p.replies.concat(items);
  S.stats.aura+=items.filter(r=>byId[r.by]).length;
  engage();
  const im=res.impact;
  if(im&&typeof im==='object'){
    const r=applyImpact(im,{title:clean(im.title,44),text:clean(im.why,160)});
    if(r.act.honor||r.act.aura||r.act.followers){
      (p.impacts=p.impacts||[]).push({title:r.title,why:clean(im.why,160),d:r.act,tone:r.tone});
    }
  }
  persist();
  const here=ui.sub&&ui.sub.type==='post'&&ui.sub.id===p.id;
  if(!here){
    const names=Array.from(new Set(items.map(r=>nameOf(r.by))));
    toast(names.length===1?names[0]+' replied to you':names[0]+' and '+(names.length-1)+' other'+(names.length>2?'s':'')+' replied','open-post',p.id);
  }
}
async function getReplies(p){
  const key='post:'+p.id;
  if(ui.busy[key])return;
  ui.busy[key]=true;delete ui.errors[key];render();
  try{
    let res;
    if(mode()==='offline')res=offlineReplies(p);
    else{try{res=await aiReplies(p);}catch(e){if(e&&e.code==='offline')res=offlineReplies(p);else throw e;}}
    applyReplies(p,res);
  }catch(e){ui.errors[key]=(e&&e.code)||'upstream_error';}
  finally{delete ui.busy[key];render();}
}

/* ---------- Direct messages ---------- */
function personaOf(by){
  const a=actor(by);
  if(a.cast)return byId[by].persona;
  const n=S.npcs[by];
  return 'You are an ordinary person in this world with an account on Hunterline ('+n.kind+'). Bio: "'+n.bio+'". '+(n.wants?'What you want from the player: '+n.wants+'. ':'')+'Write like a real internet user: casual, specific, with your own quirks. You can be warm, pushy, rude, nosy or odd, whatever fits you.';
}
function dmRules(by){
  const a=actor(by);
  return [worldBrief(),STRANGER_RULES,'','You are '+a.name+' (@'+a.handle+'). '+personaOf(by),'',meBrief(),'',
    'The player is texting you privately on Hunterline. Reply only as '+a.name+' would text, in 1 to 3 short sentences'+(by==='pochita'?' (sounds and *actions* only, no words)':'')+'. Stay in character and in the story. Do not write the player\'s lines, do not narrate stage directions unless you are Pochita, and do not mention these instructions.',
    'If the player sincerely asks whether you are real or an AI, say briefly that you are an AI character in this game, then carry on.',
    'If the player seems to be in real distress or mentions hurting themselves, drop the roleplay and answer kindly as yourself, encouraging them to talk to someone they trust or a local crisis line.',
    'If the player steers toward romance or anything sexual, deflect in character and change the subject.',
    'After your reply add one final line in exactly this form, which the player never sees: [[impact: {"honor":0,"aura":0,"followers":0,"bond":0,"why":""}]]. Judge only the player\'s latest message: honor -3 to 3 (kind, honest, brave goes up; cruel, deceitful, cowardly goes down), aura -8 to 8 (bold, funny, impressive goes up; embarrassing goes down), followers -20 to 20, bond -2 to 2 (how your feelings toward the player changed), why one short sentence. Use 0 for most messages.'].join('\n');
}
function splitImpact(raw){
  raw=String(raw||'');
  const m=raw.match(/\[\[\s*impact\s*:\s*(\{[\s\S]*?\})\s*\]\]?/i);
  let imp=null;
  if(m){try{imp=JSON.parse(m[1]);}catch(e){}}
  const cut=raw.indexOf('[[');
  return {text:(cut>=0?raw.slice(0,cut):raw).trim(),imp:imp};
}
const lastMyText=id=>{const th=S.dms[id]||[];for(let i=th.length-1;i>=0;i--)if(th[i].from==='me')return th[i].text;return '';};
async function aiDM(id){
  const turns=[];
  (S.dms[id]||[]).filter(m=>m.from!=='sys').slice(-16).forEach(m=>turns.push({role:m.from==='me'?'user':'assistant',content:m.text}));
  const raw=await aiText({system:dmRules(id),turns:turns,tier:'quick',onText:u=>{
    const t=u.text.split('[[')[0].replace(/\[+$/,'');
    ui.liveText[id]=t;
    const el=document.getElementById('live');
    if(el){el.textContent=t;scrollEnd();}
  }});
  return splitImpact(raw);
}
async function dmReply(id){
  const key='dm:'+id;
  if(ui.busy[key])return;
  ui.busy[key]=true;ui.liveText[id]='';delete ui.errors[key];render();scrollEnd();
  try{
    let out;
    if(mode()==='offline')out=offlineDM(id,lastMyText(id));
    else{try{out=await aiDM(id);}catch(e){if(e&&e.code==='offline')out=offlineDM(id,lastMyText(id));else throw e;}}
    const text=clean(out.text,600);
    if(!text)throw {code:'empty_completion'};
    S.dms[id].push({from:id,text:text,t:Date.now()});
    if(out.imp&&typeof out.imp==='object'){
      applyImpact(out.imp,{title:clean(out.imp.title,44),text:clean(out.imp.why,160),bondWho:byId[id]?id:null});
    }
    const here=ui.sub&&ui.sub.type==='chat'&&ui.sub.id===id;
    if(!here){S.unread[id]=true;toast(actor(id).name+' sent you a message','chat',id);}
    persist();
  }catch(e){ui.errors[key]=(e&&e.code)||'upstream_error';}
  finally{delete ui.busy[key];delete ui.liveText[id];render();scrollEnd();}
}

async function toAvatar(file){
  const size=128;
  let bmp=null;
  if(window.createImageBitmap){try{bmp=await createImageBitmap(file);}catch(e){}}
  if(!bmp){
    bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad'));};im.src=u;});
  }
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(w,h);
  const c=document.createElement('canvas');c.width=c.height=size;
  c.getContext('2d').drawImage(bmp,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
  return c.toDataURL('image/jpeg',0.82);
}

      '<div class="rowitem"><button class="avbtn" data-act="profile" data-id="'+n.id+'" aria-label="Open profile of '+esc(n.name)+'">'+av(n.id)+'</button>'+
      '<button class="who" data-act="profile" data-id="'+n.id+'"><b>'+esc(n.name)+'</b><span>@'+esc(n.handle)+' · '+esc(n.kind)+'</span></button>'+
      '<div class="end"><button class="chipbtn" data-act="chat" data-id="'+n.id+'">Message</button></div></div>').join('')+'</div>'
     :'<p class="empty">Nobody yet. Post something or load new posts and strangers will turn up.</p>');
}
function dmsView(){
  const ids=Object.keys(S.dms).filter(k=>S.dms[k].length).sort((a,b)=>lastT(S.dms[b])-lastT(S.dms[a]));
  const fresh=CAST.filter(c=>!(S.dms[c.id]&&S.dms[c.id].length));
  const row=id=>{
    const a=actor(id),th=S.dms[id]||[],last=th.filter(m=>m.from!=='sys').pop();
    const open=th.some(m=>m.req&&S.requests[m.req]&&S.requests[m.req].status==='open');
    const prev=last?((last.from==='me'?'You: ':'')+last.text):'Say hi';
    return '<button class="rowitem" data-act="chat" data-id="'+id+'">'+av(id)+
      '<span class="who"><b>'+esc(a.name)+(a.npc?' <span class="kind">'+esc(a.kind)+'</span>':'')+'</b><span>'+esc(prev)+'</span></span>'+
      '<span class="end">'+(open?'<span class="tag">Needs answer</span>':'')+(S.unread[id]?'<i class="pip2" aria-label="Unread"></i>':'')+(last?ago(last.t):'')+'</span></button>';
  };
  return '<h1 class="h1" style="margin-top:20px">Messages</h1><p class="lede">Characters and strangers can both message you. Some ask for something, and what you answer has consequences.</p>'+
    '<h3 class="sec">Inbox</h3>'+
    (ids.length?'<div class="list">'+ids.map(row).join('')+'</div>':'<p class="empty">No conversations yet. Start one below.</p>')+
    (fresh.length?'<h3 class="sec">Message the cast</h3><div class="list">'+fresh.map(c=>row(c.id)).join('')+'</div>':'');
}
function chatView(id){
  const a=actor(id);
  const th=S.dms[id]||[];
  const key='dm:'+id;
  let h='<div class="msgs">';
  if(!th.length&&!ui.busy[key])h+='<p class="fine">'+(a.cast?'Replies are written live by Claude playing '+esc(a.name)+'.':'')+' Start with a line of your own or pick one.</p><div class="openers">'+OPENERS.map(o=>'<button class="chip" data-act="opener" data-id="'+id+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  th.forEach(m=>{
    if(m.from==='sys'){
      h+='<div class="outcome"><div class="oh"><span class="tone '+(m.tone||'neutral')+'">'+TONE_LABEL[m.tone||'neutral']+'</span><b>'+esc(m.title)+'</b></div>'+(m.text?'<p class="fine">'+esc(m.text)+'</p>':'')+chipsHTML(m.d||{},m.bond)+'</div>';
      return;
    }
    h+='<div class="bubble '+(m.from==='me'?'me':'them')+'">'+esc(m.text)+'</div>';
    const r=m.req&&S.requests[m.req];
    if(r&&r.status==='open'){
      h+='<span class="choicehint">Your move</span><div class="choices" role="group" aria-label="Your choices">'+r.options.map(o=>'<button class="choice" data-act="choose" data-req="'+r.id+'" data-opt="'+o.id+'">'+esc(o.label)+'</button>').join('')+'</div>';
    }
  });
  if(ui.busy[key]){const lt=ui.liveText[id];h+='<div class="bubble them" id="live">'+(lt?esc(lt):'<span class="dots"><i></i><i></i><i></i></span>')+'</div>';}
  h+='</div>';
  if(ui.errors[key])h+='<div class="refresh"><span class="status">'+esc(errCopy(ui.errors[key]))+'</span><button class="btn ghost small" data-act="retry-dm" data-id="'+id+'">Try again</button></div>';
  return h;
}
function logHTML(l){
  return '<div class="logitem"><div class="oh"><span class="tone '+l.tone+'">'+TONE_LABEL[l.tone]+'</span><b>'+esc(l.title)+'</b><time>'+ago(l.t)+'</time></div>'+(l.text?'<p>'+esc(l.text)+'</p>':'')+chipsHTML(l.d,l.bond)+'</div>';
}
function meView(){
  const m=S.me,st=S.stats;
  const mine=S.posts.filter(p=>p.by==='me');
  const pos=((st.honor+100)/200*100).toFixed(1);
  const bonds=CAST.filter(c=>S.bond[c.id]);
  const md=mode();
  return '<div class="idcard"><div class="idband"><span>Resident ID</span><span>'+idNo(m.handle)+'</span></div>'+
    '<div class="idbody">'+av('me','lg')+'<div class="idtxt"><h2 class="pname">'+esc(m.name)+'</h2><div class="hd">@'+esc(m.handle)+'</div><span class="role">'+esc(m.role)+'</span></div></div>'+
    (m.bio?'<p class="idbio">'+esc(m.bio)+'</p>':'')+
    '<div class="stats"><div><b>'+st.followers+'</b><span>Followers</span></div><div><b>'+S.follows.length+'</b><span>Following</span></div><div><b>'+st.aura+'</b><span>Aura</span></div></div>'+
    '<div class="honor"><div class="hrow"><span class="lab">Honor</span><span class="hv">'+tier(st.honor)+' · '+(st.honor>0?'+':st.honor<0?'−':'')+Math.abs(st.honor)+'</span></div>'+
    '<div class="track" role="img" aria-label="Honor '+st.honor+' out of 100"><i class="mark" style="left:'+pos+'%"></i></div>'+
    '<div class="hends"><span>Notorious</span><span>Honorable</span></div></div>'+
    '<div class="idfoot"><span>Registered '+esc(dateStr(S.joined))+'</span><button class="link" data-act="edit-me">Edit ID</button></div></div>'+
    '<p class="fine" style="margin-top:10px">Aura grows when people like and answer you. Honor moves with your choices. Followers follow both.</p>'+
    '<h3 class="sec">Consequences</h3>'+
    (S.log.length?S.log.slice(0,12).map(logHTML).join(''):'<p class="empty">Your choices will show up here with what they cost and what they earned. Some consequences arrive later.</p>')+
    (S.pending.length?'<p class="fine" style="margin-top:10px">'+S.pending.length+' consequence'+(S.pending.length>1?'s are':' is')+' still on the way.</p>':'')+
    (bonds.length?'<h3 class="sec">Bonds</h3><div class="list">'+bonds.map(c=>'<button class="rowitem" data-act="profile" data-id="'+c.id+'">'+av(c.id)+'<span class="who"><b>'+esc(c.name)+'</b><span>'+bondLabel(S.bond[c.id])+'</span></span><span class="end"></span></button>').join('')+'</div>':'')+
    '<h3 class="sec">Your posts</h3>'+
    (mine.length?mine.map(p=>postHTML(p)).join(''):'<p class="empty">You have not posted yet. Say something on Home and see who answers.</p>')+
    '<h3 class="sec">Settings</h3>'+
    '<div class="setting"><b id="set-auto">Update the feed every 5 minutes</b><button class="switch" role="switch" aria-checked="'+!!S.auto+'" aria-labelledby="set-auto" data-act="auto"></button>'+
      '<span class="fine">'+(md==='claude'?'Uses your Claude usage once you have allowed Claude on this page. Until then it uses built-in stories.':md==='key'?'Uses your own API key.':'Uses built-in stories.')+' It runs while the app is open.</span></div>'+
    '<div class="setting"><b>Replies come from</b><span class="tag">'+esc(MODE_LABEL[md])+'</span></div>'+
    (STANDALONE?
      '<div class="setting" style="display:block"><b>Live AI replies (optional)</b><p class="fine" style="margin-top:4px">Offline, characters use built-in lines. Paste your own Anthropic API key to get live replies when you are online. It stays on this device and is sent only to Anthropic. Usage is billed to your API account.</p>'+
        '<div class="keyrow"><input id="key-in" type="password" autocomplete="off" aria-label="Anthropic API key" value="'+esc(ui.drafts['key-in']||'')+'" placeholder="'+(apiKey()?'Key saved on this device':'sk-ant-...')+'"><button class="btn small" data-act="save-key">Save key</button>'+(apiKey()?'<button class="btn ghost small" data-act="clear-key">Remove key</button>':'')+'</div>'+
        (ui.keyMsg?'<p class="fine" style="margin-top:6px">'+esc(ui.keyMsg)+'</p>':'')+'</div>'+
      '<div class="setting"><b id="set-th">Theme</b><div class="chips2" role="group" aria-labelledby="set-th">'+['auto','light','dark'].map(t=>'<button class="chipbtn'+((lsGet(LS_THEME)||'auto')===t?' on':'')+'" data-act="theme" data-v="'+t+'">'+cap(t)+'</button>').join('')+'</div></div>':'')+
    '<p class="fine" style="margin-top:14px">Characters are fan-written by Claude and everything here is fiction. Avatars are generated placeholders unless you set your own. Strangers are made up and can say anything that fits them, within PG-13.</p>'+
    '<div class="row" style="margin-top:16px">'+(ui.confirmReset
      ?'<span class="fine">Delete your profile, posts, messages and pictures?</span><button class="btn" data-act="reset-do">Delete everything</button><button class="btn ghost" data-act="reset-cancel">Cancel</button>'
      :'<button class="btn ghost" data-act="reset-ask">Reset world</button>')+'</div>';
}
function setupView(){
  const f=ui.form,edit=!!S;
  return '<form id="su-form" class="setup" autocomplete="off">'+
    '<h1 class="h1">'+(edit?'Edit your ID':'Who are you in Tokyo?')+'</h1>'+
    '<p class="lede">'+(edit?'Changes show on your posts and in your chats.':'Pick a name and a role. The cast will treat you as part of the city.')+'</p>'+
    '<div class="idpreview">'+avRaw(AVS.me,ini(f.name||'You'),f.hue,hash(f.handle||'me')%6,'lg','su-av')+'<div class="idtxt"><div class="pname" id="su-pn">'+esc(f.name||'Your name')+'</div><div class="hd" id="su-ph">@'+esc(f.handle||'handle')+'</div></div></div>'+
    '<div class="row"><button type="button" class="btn ghost small" data-act="pick-img" data-id="me">'+(AVS.me?'Change picture':'Upload picture')+'</button>'+(AVS.me?'<button type="button" class="btn ghost small" data-act="clear-img" data-id="me">Remove</button>':'')+'</div>'+
    '<div class="field"><label for="su-name">Display name</label><input id="su-name" maxlength="24" value="'+esc(f.name)+'" placeholder="Rin"></div>'+
    '<div class="field"><label for="su-handle">Handle</label><input id="su-handle" maxlength="15" value="'+esc(f.handle)+'" placeholder="rin_tokyo" autocapitalize="off" spellcheck="false"></div>'+
    '<div class="field"><span class="lab" id="su-rl">Role</span><div class="chips2" role="group" aria-labelledby="su-rl">'+ROLES.map(r=>'<button type="button" class="chip" data-act="role" data-v="'+esc(r)+'" aria-pressed="'+(f.role===r)+'">'+esc(r)+'</button>').join('')+'</div></div>'+
    '<div class="field"><label for="su-bio">Bio (optional)</label><textarea id="su-bio" rows="2" maxlength="120" placeholder="One line about you">'+esc(f.bio)+'</textarea></div>'+
    '<div class="field"><span class="lab" id="su-hl">Avatar color</span><div class="swatches" role="group" aria-labelledby="su-hl">'+HUES.map((h,i)=>'<button type="button" class="sw" data-act="hue" data-v="'+h+'" aria-label="Avatar color '+(i+1)+'" aria-pressed="'+(f.hue===h)+'" style="--h:'+h+'"></button>').join('')+'</div></div>'+
    '<p class="err" id="su-err" role="alert"></p>'+
    '<div class="row"><button class="btn" type="submit">'+(edit?'Save':'Join Hunterline')+'</button>'+(edit?'<button type="button" class="btn ghost" data-act="back">Cancel</button>':'')+'</div>'+
    (edit||STANDALONE?'':'<p class="fine">Characters answer through Claude, so your browser asks you to allow it the first time you post or message. Replies use your own Claude usage.</p>')+
  '</form>';
}

/* ---------- Shell ---------- */
function view(){
  if(!S||ui.editing)return setupView();
  const s=ui.sub;
  if(s){
    if(s.type==='post')return postView(s.id);
    if(s.type==='profile')return profileView(s.id);
    if(s.type==='chat')return chatView(s.id);
  }
  if(ui.tab==='cast')return castView();
  if(ui.tab==='dms')return dmsView();
  if(ui.tab==='me')return meView();
  return homeView();
}
function headerHTML(){
  const backBtn='<button class="iconbtn" data-act="back" aria-label="Back">'+ic(ICON.back,22)+'</button>';
  if(!S)return '<span class="brand">HUNTERLINE</span>';
  if(ui.editing)return backBtn+'<span class="ttl"><span class="t1">Edit ID</span></span>';
  const s=ui.sub;
  if(s){
    if(s.type==='chat'){const a=actor(s.id);return backBtn+'<span class="ttl">'+av(s.id,'sm')+'<span style="min-width:0"><span class="t1">'+esc(a.name)+'</span><span class="t2">@'+esc(a.handle)+(a.npc?' · '+esc(a.kind):'')+'</span></span></span>';}
    if(s.type==='profile')return backBtn+'<span class="ttl"><span class="t1">'+esc(actor(s.id).name)+'</span></span>';
    return backBtn+'<span class="ttl"><span class="t1">Post</span></span>';
  }
  return '<span class="brand">HUNTERLINE</span><span class="strap">Tokyo / Div. 4</span>';
}
function composerHTML(fid,tid,ph,label){
  return '<form id="'+fid+'" class="composer"><textarea id="'+tid+'" rows="1" maxlength="500" enterkeyhint="send" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">'+esc(ui.drafts[tid]||'')+'</textarea><button class="btn" type="submit">'+esc(label)+'</button></form>';
}
function composerView(){const s=ui.sub;return !!(S&&!ui.editing&&s&&(s.type==='chat'||s.type==='post'));}
function navHTML(){
  const unread=Object.keys(S.unread).some(k=>S.unread[k]);
  const tabs=[['home','Home',ICON.home],['cast','Cast',ICON.cast],['dms','Messages',ICON.dm],['me','Me',ICON.me]];
  return '<nav class="nav" aria-label="Main">'+tabs.map(t=>'<button data-act="tab" data-v="'+t[0]+'"'+(ui.tab===t[0]&&!ui.sub?' aria-current="page"':'')+'>'+ic(t[2],22)+'<span>'+t[1]+'</span>'+(t[0]==='dms'&&unread?'<i class="pip" aria-label="Unread messages"></i>':'')+'</button>').join('')+'</nav>';
}
function bottomHTML(){
  if(!S||ui.editing)return '';
  const s=ui.sub;
  if(s&&s.type==='chat')return composerHTML('dm-form','dm-input','Message '+actor(s.id).name,'Send');
  if(s&&s.type==='post'){const p=getPost(s.id);return composerHTML('reply-form','reply-input','Reply'+(p?' to @'+handleOf(p.by):''),'Reply');}
  return navHTML();
}
function tickCountdown(){
  const el=document.getElementById('next-in');if(!el||!S)return;
  if(!S.auto){el.textContent='off';return;}
  if(ui.autoPaused){el.textContent='paused';return;}
  if(ui.busy.feed){el.textContent='now';return;}
  const r=Math.max(0,Math.ceil((S.lastRefresh+AUTO_MS-Date.now())/1000));
  el.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
}
function syncBars(){
  const s=ui.sub;
  const b=document.querySelector('#bar button[type=submit]');
  if(b){const key=s&&(s.type==='chat'?'dm:'+s.id:'post:'+s.id);b.disabled=!!(key&&ui.busy[key]);}
  const ta=document.querySelector('#bar textarea');if(ta)autosize(ta);
  const cp=$('#c-post');
  if(cp){const n=cp.value.trim().length;const cb=$('#c-btn');if(cb)cb.disabled=n===0;const cc=$('#c-count');if(cc)cc.textContent=String(280-cp.value.length);}
  tickCountdown();
}
function renderMain(){
  const main=$('#main');
  const ae=document.activeElement;
  const keepId=ae&&ae.id&&main.contains(ae)?ae.id:null;
  const sel=keepId&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
  main.innerHTML=view();
  if(keepId){const el=document.getElementById(keepId);if(el){el.focus();if(sel!=null){try{el.setSelectionRange(sel,sel);}catch(e){}}}}
}
function render(){
  if(!S&&!ui.editing)return;
  renderMain();
  if(!composerView()&&S&&!ui.editing)$('#bar').innerHTML=bottomHTML();
  syncBars();
}
function renderAll(){
  $('#top').innerHTML=headerHTML();
  $('#bar').innerHTML=bottomHTML();
  renderMain();
  syncBars();
}
function autosize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function applyTheme(){
  const t=lsGet(LS_THEME)||'auto';
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){
    const act=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
    if(act==='open-post'||act==='chat'||act==='goto-me'){$('#toast').hidden=true;}
    switch(act){
      case 'tab':switchTab(v);break;
      case 'back':back();break;
      case 'goto-me':switchTab('me');break;
      case 'like':toggle(id,'like');break;
      case 'repost':toggle(id,'repost');break;
      case 'open-post':openSub({type:'post',id:id});break;
      case 'profile':if(id==='me')switchTab('me');else openSub({type:'profile',id:id});break;
      case 'chat':openSub({type:'chat',id:id});break;
      case 'follow':toggleFollow(id);break;
      case 'feed':ui.feed=v;render();break;
      case 'refresh':refreshFeed();break;
      case 'stop-refresh':if(ui.feedCtl)ui.feedCtl.abort();break;
      case 'auto':S.auto=!S.auto;if(S.auto){S.lastRefresh=Date.now();ui.autoPaused=false;}persist();render();break;
      case 'retry-dm':dmReply(id);break;
      case 'retry-post':{const p=getPost(id);if(p)getReplies(p);break;}
      case 'opener':sendDM(id,v);break;
      case 'choose':choose(el.dataset.req,el.dataset.opt);break;
      case 'pick-img':pickImage(id);break;
      case 'clear-img':delete AVS[id];persistAv();if(S&&!ui.editing)renderAll();else renderMain();break;
      case 'edit-me':ui.form=Object.assign({},S.me,{handleTouched:true});ui.editing=true;renderAll();window.scrollTo(0,0);break;
      case 'reset-ask':ui.confirmReset=true;render();break;
      case 'reset-cancel':ui.confirmReset=false;render();break;
      case 'reset-do':wipe();break;
      case 'save-key':{
        const inp=$('#key-in');const k=inp?inp.value.trim():'';
        if(!k){ui.keyMsg='Paste a key first.';}
        else if(!/^sk-ant-/.test(k)){ui.keyMsg="That doesn't look like an Anthropic key. Keys start with sk-ant-.";}
        else{lsSet(LS_KEYAPI,k);ui.drafts['key-in']='';ui.keyMsg='Saved. Characters will use it while you are online.';}
        render();break;}
      case 'clear-key':lsDel(LS_KEYAPI);ui.keyMsg='Key removed. Characters use built-in lines.';render();break;
      case 'theme':lsSet(LS_THEME,v);applyTheme();render();break;
      case 'role':
        ui.form.role=v;
        document.querySelectorAll('[data-act="role"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
        break;
      case 'hue':{
        ui.form.hue=Number(v);
        document.querySelectorAll('[data-act="hue"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
        const a=$('#su-av');if(a&&!AVS.me)a.style.setProperty('--h',v);
        break;}
    }
    return;
  }
  const card=e.target.closest('[data-open]');
  if(card&&!e.target.closest('button,a,textarea,input')){
    openSub({type:'post',id:card.dataset.open});
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id)ui.drafts[t.id]=t.value;
  if(t.id==='su-name'){
    ui.form.name=t.value;
    if(!ui.form.handleTouched){
      const h=t.value.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,15);
      ui.form.handle=h;const hi=$('#su-handle');if(hi)hi.value=h;
    }
    const a=$('#su-av');if(a&&!AVS.me)a.textContent=ini(t.value||'You');
    const pn=$('#su-pn');if(pn)pn.textContent=t.value||'Your name';
    const ph=$('#su-ph');if(ph)ph.textContent='@'+(ui.form.handle||'handle');
  }else if(t.id==='su-handle'){
    ui.form.handleTouched=true;ui.form.handle=t.value;
    const ph=$('#su-ph');if(ph)ph.textContent='@'+(t.value||'handle');
  }else if(t.id==='su-bio'){ui.form.bio=t.value;}
  else if(t.id==='c-post'){syncBars();}
  else if(t.id==='dm-input'||t.id==='reply-input'){autosize(t);}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((t.id==='dm-input'||t.id==='reply-input')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();
    if(t.form&&t.form.requestSubmit)t.form.requestSubmit();
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='su-form')submitSetup();
  else if(f.id==='post-form')sendPost($('#c-post').value);
  else if(f.id==='reply-form')sendReply($('#reply-input').value);
  else if(f.id==='dm-form'&&ui.sub&&ui.sub.type==='chat')sendDM(ui.sub.id,$('#dm-input').value);
});
$('#file-in').addEventListener('change',async e=>{
  const inp=e.target,f=inp.files&&inp.files[0],id=inp.dataset.for;
  inp.value='';
  if(!f||!id)return;
  try{
    if(!AVS[id]&&Object.keys(AVS).length>=24)throw new Error('limit');
    AVS[id]=await toAvatar(f);
    persistAv();
    if(S&&!ui.editing)renderAll();else renderMain();
  }catch(err){
    toast(err&&err.message==='limit'?'You can set up to 24 custom pictures. Remove one first.':"That image couldn't be used. Try a JPG or PNG.");
  }
});

/* ---------- Timer: pending consequences and the 5 minute refresh ---------- */
setInterval(()=>{
  if(!S)return;
  processPending();
  if(S.auto&&!ui.autoPaused&&!ui.busy.feed&&document.visibilityState==='visible'&&Date.now()>=S.lastRefresh+AUTO_MS)refreshFeed({auto:true});
  tickCountdown();
},1000);

/* ---------- Boot ---------- */
applyTheme();
S=lsRead(LS_KEY);
if(S&&(!S.me||!Array.isArray(S.posts)))S=null;
if(S)S=migrate(S);
AVS=lsRead(LS_AV)||{};
renderAll();
initDb();
})();
</script>
</body>
</html>
